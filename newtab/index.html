<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SF Log Analyzer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ext-layout" id="ext-layout">

    <!-- Left sidebar: log list -->
    <aside class="log-sidebar" id="log-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <span class="sidebar-logo">⚡</span>
          SF Log Analyzer
        </div>
        <div class="sidebar-org" id="sidebar-org">Not connected</div>
      </div>

      <div class="sidebar-controls">
        <button class="sidebar-btn primary" id="btn-refresh">↺ Refresh</button>
        <label class="sidebar-label">
          <input type="checkbox" id="chk-unread-only" /> Unread only
        </label>
      </div>

      <div id="log-list-state" class="log-list-state">
        <div class="log-list-placeholder">
          <div class="placeholder-icon">🔍</div>
          <p>Open a Salesforce org tab first, then click Refresh.</p>
        </div>
      </div>

      <table class="log-table" id="log-table" style="display:none;">
        <thead>
          <tr>
            <th>User</th>
            <th>Operation</th>
            <th>Time</th>
            <th>Size</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="log-table-body"></tbody>
      </table>
    </aside>

    <!-- Drag handle between sidebar and main (outside both, positioned by JS) -->
    <div class="sidebar-resizer" id="sidebar-resizer" title="Drag to resize"></div>

    <!-- Main content: analyzer -->
    <main class="analyzer-main">
      <div class="page">
        <section id="summary" class="summary empty">
          <div class="placeholder">
            <h2>No log selected</h2>
            <p>Select a log from the list on the left to analyse it.</p>
          </div>
        </section>
      </div>
      <div id="span-tooltip" class="span-tooltip" style="display:none;"></div>
    </main>

  </div>

  <script src="main.js"></script>
  <script src="app.js"></script>
  <script>
    // Sidebar drag-to-resize
    const resizer = document.getElementById('sidebar-resizer');
    const sidebar = document.getElementById('log-sidebar');
    let isResizing = false;
    let startX = 0;
    let startWidth = 0;

    resizer.addEventListener('mousedown', (e) => {
      isResizing = true;
      startX = e.clientX;
      startWidth = sidebar.offsetWidth;
      resizer.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      const newWidth = Math.min(600, Math.max(180, startWidth + (e.clientX - startX)));
      sidebar.style.width = newWidth + 'px';
    });

    document.addEventListener('mouseup', () => {
      if (!isResizing) return;
      isResizing = false;
      resizer.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    });
  </script>
</body>
</html>
