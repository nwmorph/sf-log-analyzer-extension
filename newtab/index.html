<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SF Log Analyzer</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="ai-summary.css" />
  <style>
    /* Inline to ensure it loads before any FOUC */
    .sidebar-resizer {
      width: 6px;
      flex-shrink: 0;
      cursor: col-resize !important;
      background: #c0c0c0;
      transition: background 0.15s;
      z-index: 100;
    }
    .sidebar-resizer:hover { background: #0066b8; }
  </style>
</head>
<body>
  <div class="ext-layout" id="ext-layout">

    <aside class="log-sidebar" id="log-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <span class="sidebar-logo">⚡</span>
          SF Log Analyzer
        </div>
        <div class="sidebar-org" id="sidebar-org">Not connected</div>
        <select id="org-switcher" class="org-switcher" style="display:none"></select>
      </div>

      <div class="sidebar-controls">
        <button class="sidebar-btn primary" id="btn-refresh">↺ Refresh</button>
        <label class="sidebar-label">
          <input type="checkbox" id="chk-unread-only" /> Unread only
        </label>
      </div>

      <div id="log-list-state" class="log-list-state">
        <div class="log-list-placeholder">
          <div class="placeholder-icon">🔍</div>
          <p>Open a Salesforce org tab first, then click Refresh.</p>
        </div>
      </div>

      <table class="log-table" id="log-table" style="display:none;">
        <thead>
          <tr>
            <th>User</th>
            <th>Operation</th>
            <th>Time</th>
            <th>Size</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="log-table-body"></tbody>
      </table>
    </aside>

    <div id="sidebar-resizer" class="sidebar-resizer"></div>

    <main class="analyzer-main">
      <div class="page">
        <section id="summary" class="summary empty">
          <div class="placeholder">
            <h2>No log selected</h2>
            <p>Select a log from the list on the left to analyse it.</p>
          </div>
        </section>
      </div>
      <div id="span-tooltip" class="span-tooltip" style="display:none;"></div>
    </main>

  </div>

  <script src="main.js"></script>
  <script src="app.js"></script>
  <script>
    (function() {
      const resizer = document.getElementById('sidebar-resizer');
      const sidebar = document.getElementById('log-sidebar');
      let active = false;
      let startX = 0;
      let startW = 0;

      // Use a transparent overlay during drag to capture all mouse events
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;cursor:col-resize;display:none;';
      document.body.appendChild(overlay);

      resizer.addEventListener('mousedown', function(e) {
        active = true;
        startX = e.clientX;
        startW = sidebar.getBoundingClientRect().width;
        overlay.style.display = 'block';
        e.preventDefault();
      });

      overlay.addEventListener('mousemove', function(e) {
        if (!active) return;
        const w = Math.min(700, Math.max(180, startW + e.clientX - startX));
        sidebar.style.width = w + 'px';
      });

      overlay.addEventListener('mouseup', function() {
        active = false;
        overlay.style.display = 'none';
      });

      overlay.addEventListener('mouseleave', function() {
        active = false;
        overlay.style.display = 'none';
      });
    })();
  </script>
</body>
</html>
