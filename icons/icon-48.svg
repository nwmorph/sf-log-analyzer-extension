<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Blue rounded background -->
  <rect width="128" height="128" rx="22" fill="#1a6fbf"/>

  <!-- White log lines (left) -->
  <rect x="14" y="42" width="26" height="8" rx="4" fill="white"/>
  <rect x="14" y="58" width="22" height="8" rx="4" fill="white"/>
  <rect x="14" y="74" width="26" height="8" rx="4" fill="white"/>

  <!-- White magnifying glass ring -->
  <circle cx="72" cy="58" r="28" fill="none" stroke="white" stroke-width="9"/>

  <!-- Magnifying glass handle -->
  <line x1="93" y1="79" x2="112" y2="98" stroke="white" stroke-width="11" stroke-linecap="round"/>

  <!-- Red bug body -->
  <ellipse cx="72" cy="58" rx="13" ry="17" fill="#e02020"/>

  <!-- Red bug head -->
  <ellipse cx="72" cy="38" rx="9" ry="8" fill="#e02020"/>

  <!-- Bug antennae -->
  <line x1="67" y1="32" x2="62" y2="24" stroke="#e02020" stroke-width="3" stroke-linecap="round"/>
  <line x1="77" y1="32" x2="82" y2="24" stroke="#e02020" stroke-width="3" stroke-linecap="round"/>

  <!-- Bug legs left -->
  <line x1="59" y1="50" x2="50" y2="46" stroke="#e02020" stroke-width="3" stroke-linecap="round"/>
  <line x1="59" y1="58" x2="50" y2="58" stroke="#e02020" stroke-width="3" stroke-linecap="round"/>
  <line x1="59" y1="66" x2="50" y2="70" stroke="#e02020" stroke-width="3" stroke-linecap="round"/>

  <!-- Bug legs right -->
  <line x1="85" y1="50" x2="94" y2="46" stroke="#e02020" stroke-width="3" stroke-linecap="round"/>
  <line x1="85" y1="58" x2="94" y2="58" stroke="#e02020" stroke-width="3" stroke-linecap="round"/>
  <line x1="85" y1="66" x2="94" y2="70" stroke="#e02020" stroke-width="3" stroke-linecap="round"/>
</svg>
